{% extends 'movies/base.html' %}
{% block title %}Recipient details{% endblock %}
{% block content %}
<div class="container">
    <h3 class="mt-3 mb-3">
        {{ actor.name }}:
    </h3>
    <div class="col">
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <p>
                    Name:
                </p>
                <p>
                    {{ actor.name }}
                </p>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <p>
                    Bio:
                </p>
                <p>
                    {{ actor.bio }}
                </p>
            </li>
        </ul>
    </div>
    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
        <a href="{% url 'movies:actors' %}" class="btn btn-outline-secondary">
            Back
        </a>
        {% if user.is_staff %}
        <a href="{% url 'movies:actor-update' actor.pk %}" class="btn btn-outline-secondary">
            Edit
        </a>
        <a href="{% url 'movies:actor-delete' actor.pk %}" class="btn btn-outline-danger">
            Delete
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
