{% extends 'movies/base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mt-5">Подтвердите удаление</h1>
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить? "{{ genre.name }}"?</p>
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'movies:genres' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
